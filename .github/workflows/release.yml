name: Release

# Creates a GitHub Release with a portable, self-contained zip
# whenever a v* tag is pushed (e.g. v1.0.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish standalone unpackaged app
        run: dotnet publish "NewHwInspector.csproj" -c Release -p:Platform=x64 -o "publish/NewHwInspector_Portable"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path 'publish/NewHwInspector_Portable/resources.pri')) {
            throw 'App PRI missing from publish output'
          }
          Compress-Archive -Path "publish/NewHwInspector_Portable/*" -DestinationPath "NewHwInspector-${{ github.ref_name }}-win-x64.zip"
          Get-Item "NewHwInspector-${{ github.ref_name }}-win-x64.zip" | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB, 2)}}

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: NewHwInspector-*-win-x64.zip
          generate_release_notes: true
          overwrite: true
